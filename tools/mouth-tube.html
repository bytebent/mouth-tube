<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mouth-tube bench</title>
<style>
:root{
  --platinum:#dcdce0; --platinum-hi:#ececef; --etch:#9c9ca4; --ink:#000; --ink-soft:#4a4a52; --inset:#f4f4f6; --desk:#b9b9c0;
  --red:#e03a3e; --red-dk:#9e1f23; --blue:#009ddc; --blue-dk:#00699a; --purple:#963d97; --purple-dk:#6a2a6b; --graphite:#6e6e78;
  --screen:#0b0b0e; --lcd:#8f8;
  --ui:"Lucida Grande","Lucida Sans Unicode",Geneva,Verdana,sans-serif; --mono:Monaco,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 1px 1px, rgba(0,0,0,.09) 1px, transparent 1.5px) 0 0/6px 6px, var(--desk);
  font:13px/1.45 var(--ui); color:var(--ink); padding:24px 16px 40px; -webkit-user-select:none; user-select:none}
.window{max-width:960px;margin:0 auto;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, rgba(255,255,255,0) 1px 2px, rgba(0,0,0,.035) 2px 3px, rgba(0,0,0,0) 3px 4px), var(--platinum);
  border:1px solid #7d7d86;border-radius:9px;box-shadow:0 1px 0 #fff inset, 0 12px 32px rgba(0,0,0,.22);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:10px;padding:7px 12px 6px;background:linear-gradient(#f6f6f8,#d6d6db);border-bottom:1px solid #8e8e96}
.closebox{width:12px;height:12px;border:1px solid #6e6e78;border-radius:2px;background:linear-gradient(#fff,#cfcfd5);flex:none}
.titlebar .lines{flex:1;height:9px;background:repeating-linear-gradient(0deg,#9c9ca4 0 1px,transparent 1px 3px);opacity:.6;min-width:12px}
.titlebar .t{font-weight:700;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.titlebar .arrow{color:var(--ink-soft);font-weight:400}
.mark{width:20px;height:16px;border-radius:3px;background:var(--graphite);box-shadow:0 0 0 1px rgba(0,0,0,.35);position:relative;flex:none;overflow:hidden;display:inline-block}
.mark::after{content:"";position:absolute;left:0;right:0;top:6px;height:4px;background:var(--red)}
.mark.mouth::after{background:var(--purple)}
.titlebar .ver{color:var(--ink-soft);font-size:11px;white-space:nowrap}
.body{padding:14px 18px 16px}

/* screen */
.screen{background:var(--screen);border-radius:6px;padding:10px;box-shadow:0 0 0 1px #000,0 2px 6px rgba(0,0,0,.5) inset;position:relative}
.views{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.view{position:relative}
.view canvas{display:block;width:100%;height:220px;border-radius:3px;background:#060608}
.view .lbl{position:absolute;left:8px;top:6px;font:10px/1 var(--mono);color:var(--lcd);opacity:.8;letter-spacing:1px;pointer-events:none}
.readouts{display:flex;flex-wrap:wrap;gap:4px 18px;font:11px/1 var(--mono);color:var(--lcd);margin-top:8px;letter-spacing:1px}
.readouts b{font-weight:400;opacity:.6;margin-right:6px}
.readouts .gap{margin-left:auto}
.power{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,11,14,.86);border-radius:6px;z-index:2}
.power.hide{display:none}

/* groups and knobs */
.rows{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:stretch}
fieldset{flex:1 1 auto;margin:0;border:1px solid var(--etch);border-radius:6px;padding:8px 12px 10px;background:rgba(236,236,239,.7);box-shadow:0 1px 0 #fff, inset 0 1px 0 #fff;min-width:0}
legend{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:0 6px;display:flex;align-items:center;gap:6px}
legend .dot{width:8px;height:8px;border-radius:50%;background:var(--graphite);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
legend .dot.p{background:var(--purple)}
legend .dot.r{background:var(--red)}
.knobs{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;justify-content:space-around}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;width:62px}
.dial{--a0:0deg;--a1:0deg;--c:var(--graphite);position:relative;width:44px;height:44px;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;
  background:conic-gradient(from 225deg, #b9b9c0 0 var(--a0), var(--c) var(--a0) var(--a1), #b9b9c0 var(--a1) 270deg, transparent 270deg)}
.dial::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--platinum-hi)}
.dial .cap{position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.95) 0 18%, rgba(255,255,255,0) 46%), radial-gradient(circle at 50% 80%, #f7f7fa, #c8c8ce 60%, #9a9aa3);
  box-shadow:0 2px 3px rgba(0,0,0,.35), 0 0 0 1px #7d7d86}
.dial .ptr{position:absolute;inset:6px;border-radius:50%;pointer-events:none}
.dial .ptr::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:30%;margin-left:-1.5px;border-radius:2px;background:#1a1a1e}
.dial .tick{position:absolute;left:50%;top:-4px;width:2px;height:6px;margin-left:-1px;background:var(--ink-soft);border-radius:1px;transform-origin:1px 26px;pointer-events:none}
.dial:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.knob .name{font-weight:700;white-space:nowrap}
.val{font:700 10.5px var(--ui);background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);border-radius:3px;padding:1px 6px;min-width:52px;text-align:center;white-space:nowrap}
.seg{display:inline-flex;border:1px solid #7d7d86;border-radius:999px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg button{font:700 11px var(--ui);border:0;padding:4px 12px;cursor:pointer;color:#222;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.seg button+button{border-left:1px solid #9c9ca4}
.seg button[aria-pressed="true"]{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.3);background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea)}
.segwrap{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;padding-bottom:4px}

.gel{display:inline-flex;align-items:center;gap:6px;padding:6px 18px;border-radius:999px;font:700 12px var(--ui);color:#fff;border:1px solid var(--blue-dk);position:relative;cursor:pointer;
  background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea);box-shadow:0 2px 4px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.5) inset;text-shadow:0 -1px 0 rgba(0,0,0,.3)}
.gel::before{content:"";position:absolute;left:10px;right:10px;top:2px;height:45%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.1));pointer-events:none}
.gel.grey{color:#222;border-color:#7d7d86;text-shadow:0 1px 0 #fff;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.gel.red{border-color:var(--red-dk);background:linear-gradient(#f7a4a6,var(--red) 48%,#c42a2e 52%,#ee6a6d)}
.gel:disabled{opacity:.5;cursor:default}
.gel:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* tongue pad */
.padpanel{flex:0 0 auto;background:var(--platinum-hi);border:1px solid var(--etch);border-radius:6px;box-shadow:0 1px 0 #fff, inset 0 1px 0 #fff;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.padpanel .hd{align-self:stretch;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.padpanel .hd .dot{width:8px;height:8px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
#pad{display:block;width:260px;height:auto;touch-action:none;cursor:crosshair;outline:none;border-radius:4px}
#pad:focus-visible{box-shadow:0 0 0 2px var(--blue)}
#pad .face{fill:var(--inset);stroke:#7d7d86;stroke-width:1.2}
#pad .grid{stroke:#c4c4ca;stroke-width:1;fill:none}
#pad .v{font:12px var(--ui);fill:#8a8a93;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#pad .ax{font:700 8.5px var(--ui);fill:var(--ink-soft);letter-spacing:.8px;text-anchor:middle;pointer-events:none}
.padval{display:flex;gap:8px}
.mouthctl{flex:1 1 420px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}

/* input bar */
.inputbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;padding:8px 12px;border:1px solid var(--etch);border-radius:6px;background:rgba(236,236,239,.7);box-shadow:0 1px 0 #fff, inset 0 1px 0 #fff}
.inputbar .lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.fname{font:11px var(--mono);background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);border-radius:3px;padding:3px 8px;min-width:180px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
.tri{width:0;height:0;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.3))}
.sq{width:9px;height:9px;background:#fff;border-radius:1px}

.err{display:none;margin-top:10px;padding:8px 10px;border-left:4px solid var(--red);background:#fdeced;font-size:12px}
@media (max-width:760px){ .views{grid-template-columns:1fr} #pad{width:220px} .fname{min-width:120px} }
</style>
</head>
<body>
<div class="window" role="application" aria-label="mouth-tube test bench">
  <div class="titlebar"><span class="closebox"></span><span class="lines"></span>
    <span class="t"><span class="mark mouth" aria-hidden="true"></span>mouth-tube</span>
    <span class="lines"></span><span class="ver">bench v0.1 · Bytebent Audio</span></div>
  <div class="body">
    <div class="screen">
      <div class="views">
        <div class="view"><canvas id="tract" aria-label="Vocal tract shape, side view and tube sections"></canvas><span class="lbl">TRACT</span></div>
        <div class="view"><canvas id="spec" aria-label="Output spectrum with the tract's response and formants"></canvas><span class="lbl" style="left:auto;right:8px">SPECTRUM</span></div>
      </div>
      <div class="readouts" aria-live="off">
        <span><b>F1</b><span id="roF1">—</span></span>
        <span><b>F2</b><span id="roF2">—</span></span>
        <span><b>F3</b><span id="roF3">—</span></span>
        <span><b>LEN</b><span id="roLen">—</span></span>
      </div>
      <div class="power" id="power">
        <button class="gel red" id="powerBtn" type="button">Power on</button>
      </div>
    </div>

    <div class="rows">
      <div class="padpanel">
        <div class="hd"><span class="dot"></span>Tongue position</div>
        <svg id="pad" viewBox="0 0 260 186" tabindex="0" role="slider" aria-label="Tongue position: front to back and close to open" aria-roledescription="2D slider">
          <defs>
            <radialGradient id="gloss" cx="50%" cy="78%" r="70%">
              <stop offset="0" stop-color="#d79ad8"/><stop offset=".55" stop-color="#963d97"/><stop offset="1" stop-color="#5e235f"/>
            </radialGradient>
            <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
            </linearGradient>
          </defs>
          <g id="padStatic"></g>
          <g id="padDot" pointer-events="none">
            <circle r="11" fill="rgba(0,0,0,.25)" cx="0" cy="2"/>
            <circle r="10" fill="url(#gloss)" stroke="#4d1c4e" stroke-width="1"/>
            <ellipse rx="6" ry="3.6" cy="-4.2" fill="url(#shine)"/>
          </g>
        </svg>
        <div class="padval"><span class="val" id="padX">Front 55%</span><span class="val" id="padY">Open 70%</span></div>
      </div>
      <div class="mouthctl">
        <fieldset><legend><span class="dot p"></span>Tongue</legend><div class="knobs" id="g-tongue"></div></fieldset>
        <fieldset><legend><span class="dot p"></span>Jaw</legend><div class="knobs" id="g-jaw"></div></fieldset>
        <fieldset><legend><span class="dot p"></span>Lips</legend><div class="knobs" id="g-lips"></div></fieldset>
        <fieldset><legend><span class="dot"></span>Velum</legend><div class="knobs" id="g-velum"></div></fieldset>
        <fieldset><legend><span class="dot"></span>Tract</legend><div class="knobs" id="g-tract"></div></fieldset>
        <fieldset><legend><span class="dot"></span>Output</legend><div class="knobs" id="g-mout">
          <div class="segwrap">Radiation<div class="seg" id="segRad"><button type="button" data-v="1">On</button><button type="button" data-v="0">Off</button></div></div>
        </div></fieldset>
      </div>
    </div>

    <div class="inputbar">
      <span class="lab">Input</span>
      <button class="gel grey" id="loadBtn" type="button">Load file…</button>
      <span class="fname" id="fname">No file loaded</span>
      <button class="gel" id="playBtn" type="button" disabled><span class="tri" id="playIcon"></span><span id="playTxt">Play</span></button>
      <input type="file" id="file" accept="audio/*,.wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a" hidden>
    </div>

    <div class="err" id="err"></div>
  </div>
</div>

<script type="text/plain" id="dsp">
/*
 * mouth-tube v0.1 · bytebent
 *
 * A vocal tract as an audio effect. It makes no sound of its own: whatever comes in
 * travels through a tube shaped like a mouth and comes out of the lips (and the nose).
 *
 *   - Kelly-Lochbaum waveguide: N_ORAL sections from glottis to lips, plus a nasal branch
 *     joined at the velum by a three-way junction. Waves are volume-velocity waves, so a
 *     closed section passes nothing.
 *   - The tube shape comes from the controls: tongue position (front/back, close/open),
 *     tongue tip, jaw, lip opening, lip rounding, velum. Nothing in here knows about
 *     vowels or consonants; sounds come from the shape alone.
 *   - Tract length is real: the tube runs at its own rate (sections × speed of sound /
 *     length) and windowed-sinc resampling moves audio in and out, so formants scale
 *     smoothly with Length.
 *   - Dual mono: one tube per channel. Spread makes the two tubes differ slightly.
 *   - Radiation at the lips (flow → pressure, +6 dB/oct), Mix, Output.
 *
 * process() never allocates. Works in an AudioWorklet and in Node (module.exports).
 */
(function (root) {
  'use strict';

  const N_ORAL = 40;                  // oral sections, glottis → lips
  const N_NOSE = 25;                  // nasal sections, velum → nostrils
  const VELUM = 16;                   // junction index where the nose joins (between sections 15 and 16)
  const SOUND = 350;                  // m/s, warm moist air
  const MIN_AREA = 1e-6;
  const GLOT_REFL = 0.85;             // flow-wave reflection at the (mostly closed) glottis end (closed = +1)
  const LIP_REFL = -0.97;             // flow-wave reflection at the open lips (open = -1) at low frequencies...
  const LIP_RAD_HZ = 4000;            // ...falling above this (scaled by the opening): wide lips radiate more highs
  const NOSE_REFL = -0.95, NOSE_RAD_HZ = 3000;
  const BLOCK = 32;                   // control block (host samples)
  const ROUND_LEN = 0.10;             // rounding lengthens the tube by up to 10 %
  const SPREAD_LEN = 0.06;            // spread: ± 6 % length per side
  const SPREAD_TONGUE = 0.08;         // spread: ± tongue front/back offset per side
  const LEN_MIN = 7, LEN_MAX = 35;    // cm
  const RAD_REF_HZ = 1000;            // radiation filter has unity gain here

  // level match vs. the dry signal, measured on a glottal-flow source (Throat at C2, modal voice) with the default mouth
  const GAIN_RAD = 7.1;
  const GAIN_FLOW = 1.58;

  /* ---------- windowed-sinc kernel (shared) ---------- */

  const HW = 8;                       // zero crossings each side
  const KRES = 512;                   // table points per zero crossing
  const KT = new Float64Array(HW * KRES + 2);
  for (let k = 0; k <= HW * KRES; k++) {
    const x = k / KRES;
    const s = x === 0 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x);
    const w = 0.42 + 0.5 * Math.cos(Math.PI * x / HW) + 0.08 * Math.cos(2 * Math.PI * x / HW);
    KT[k] = s * w;
  }
  KT[HW * KRES] = 0; KT[HW * KRES + 1] = 0;
  const CUT = 0.45;                   // resampler cutoff as a fraction of the lower rate

  /* ---------- parameters ---------- */

  const PARAMS = {
    tongueX:   { def: 0.55, min: 0, max: 1 },     // 0 front … 1 back
    tongueY:   { def: 0.7,  min: 0, max: 1 },     // 0 close … 1 open
    tip:       { def: 0,    min: 0, max: 1 },
    jaw:       { def: 0.3,  min: 0, max: 1 },
    lips:      { def: 0.6,  min: 0, max: 1 },     // opening
    round:     { def: 0,    min: 0, max: 1 },
    nasal:     { def: 0,    min: 0, max: 1 },     // velum opening
    length:    { def: 17,   min: LEN_MIN, max: LEN_MAX },   // cm
    damping:   { def: 0.5,  min: 0, max: 1 },
    spread:    { def: 0,    min: 0, max: 1 },
    radiation: { def: 1,    min: 0, max: 1 },     // switch
    mix:       { def: 1,    min: 0, max: 1 },
    output:    { def: 0,    min: -24, max: 12 },  // dB
  };
  const SMOOTHED = ['tongueX', 'tongueY', 'tip', 'jaw', 'lips', 'round', 'nasal', 'length', 'damping', 'spread', 'radiation', 'mix', 'output'];

  /* ---------- tube shape from the controls ---------- */

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const bilin = (fc, bc, fo, bo, X, Y) => lerp(lerp(fc, bc, X), lerp(fo, bo, X), Y);
  const NOSE_D = new Float64Array(N_NOSE);
  for (let k = 0; k < N_NOSE; k++) {
    const y = (k + 0.5) / N_NOSE;
    NOSE_D[k] = y < 0.3 ? 0.6 + 1.2 * y / 0.3 : y < 0.8 ? 1.8 : 1.8 - 0.9 * (y - 0.8) / 0.2;
  }

  // Tongue shapes at the four corners of the vowel chart, as diameters at CX along the tract
  // (0 = glottis, 1 = lips; the lips themselves are separate). The middle of the chart is a
  // uniform tube; everything in between is a blend. Tuned in tests/tune.js.
  const CX = [0.08, 0.16, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.92];
  const CORNERS = {
    fc: [1.20, 1.74, 2.23, 2.77, 2.44, 1.67, 1.04, 0.74, 0.87, 1.34],    // front close
    bc: [1.20, 1.52, 1.78, 2.50, 1.48, 0.74, 1.16, 1.84, 2.19, 1.34],    // back close
    fo: [1.20, 1.23, 1.60, 1.88, 2.09, 2.28, 2.32, 2.12, 2.37, 3.53],    // front open
    bo: [1.20, 0.63, 0.68, 0.76, 1.01, 1.55, 2.36, 2.82, 2.81, 2.49],    // back open
  };
  const REST = 2.0;
  const NC = CX.length;
  const cornerLog = { fc: new Float64Array(NC), bc: new Float64Array(NC), fo: new Float64Array(NC), bo: new Float64Array(NC) };
  function prepCorners() { for (const k in CORNERS) for (let i = 0; i < NC; i++) cornerLog[k][i] = Math.log(CORNERS[k][i]); }
  prepCorners();
  const ctl = new Float64Array(NC);

  // Fills d (N_ORAL diameters, arbitrary units, area = d²) and returns the nasal coupling area.
  // side: -1 / +1 for the two spread tubes, 0 for the centre shape.
  function shape(s, d, side) {
    const X = clamp01(s.tongueX + side * s.spread * SPREAD_TONGUE), Y = clamp01(s.tongueY);
    // how far the tongue is from rest: 0 in the middle of the chart, 1 in the corners
    const m = Math.min(1, Math.sqrt((2 * X - 1) ** 2 + (2 * Y - 1) ** 2) / Math.SQRT2);
    const lr = Math.log(REST), C = cornerLog;
    for (let i = 0; i < NC; i++) ctl[i] = Math.exp(lr + m * (bilin(C.fc[i], C.bc[i], C.fo[i], C.bo[i], X, Y) - lr));
    ctl[0] = CORNERS.fc[0];
    for (let i = 0; i < N_ORAL; i++) {
      const x = (i + 0.5) / N_ORAL;
      let v;
      if (x <= CX[0]) v = ctl[0];
      else if (x >= CX[NC - 1]) v = ctl[NC - 1];
      else {
        let k = 1; while (CX[k] < x) k++;
        const t = (x - CX[k - 1]) / (CX[k] - CX[k - 1]);
        v = lerp(ctl[k - 1], ctl[k], 0.5 - 0.5 * Math.cos(Math.PI * t));
      }
      if (x > 0.55) v *= 1 + 0.8 * (s.jaw - 0.3) * clamp01((x - 0.55) / 0.2);   // jaw: opens (or closes) the mouth cavity
      const dt = x - 0.86;                                   // tongue tip at the ridge behind the teeth
      if (dt > -0.045 && dt < 0.045) v *= Math.max(0, 1 - s.tip * 1.05 * 0.5 * (1 + Math.cos(Math.PI * dt / 0.045)));
      if (x > 0.89 && x < 0.95) v *= 1 - 0.25 * s.round;
      d[i] = v > 0 ? v : 0;
    }
    // lips: the last two sections
    const lip = 2.6 * Math.pow(s.lips, 1.2) * (1 - 0.7 * s.round);
    d[N_ORAL - 1] = lip;
    d[N_ORAL - 2] = lerp(d[N_ORAL - 2], lip, 0.6);
    // velum: lowering it opens the nose and narrows the oral tube there a little
    d[VELUM - 1] *= 1 - 0.2 * s.nasal;
    d[VELUM] *= 1 - 0.2 * s.nasal;
    const vn = 1.0 * s.nasal;
    return vn * vn;
  }

  /* ---------- one tube (waveguide) ---------- */

  class Tube {
    constructor() {
      this.R = new Float64Array(N_ORAL); this.L = new Float64Array(N_ORAL);
      this.jR = new Float64Array(N_ORAL); this.jL = new Float64Array(N_ORAL);

      sx.beginPath(); sx.moveTo(0, H);
      let px = -1;
      for (let x = 0; x <= W; x += d) {
        const f0 = fmin * Math.pow(fmax / fmin, x / W), f1 = fmin * Math.pow(fmax / fmin, (x + d) / W);
        let b0 = Math.floor(f0 / binHz), b1 = Math.max(b0 + 1, Math.ceil(f1 / binHz)), m = -200;
        for (let b = b0; b < b1 && b < fbuf.length; b++) m = Math.max(m, fbuf[b]);
        sx.lineTo(x, y(m)); px = x;
      }
      sx.lineTo(px, H); sx.closePath();
      const grd = sx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, 'rgba(150,61,151,.6)'); grd.addColorStop(1, 'rgba(150,61,151,.06)');
      sx.fillStyle = grd; sx.fill();
      sx.strokeStyle = PURPLE_HI; sx.lineWidth = 1.2 * d; sx.stroke();
    }
    if (!viz) return;
    // the tract's own response (what the tube does to any input), scaled to sit in the top half
    let mx = -1e9; for (let i = 0; i < NF; i++) if (FREQS[i] < 5000) mx = Math.max(mx, RESP[i]);
    const ry = v => 20 * d + (mx - v) / 45 * (H * 0.7);
    sx.strokeStyle = 'rgba(255,255,255,.75)'; sx.lineWidth = 1.2 * d; sx.setLineDash([4 * d, 3 * d]);
    sx.beginPath();
    for (let i = 0; i < NF && FREQS[i] < 7000; i++) { const x = lx(FREQS[i]), yv = Math.min(H, ry(RESP[i])); i ? sx.lineTo(x, yv) : sx.moveTo(x, yv); }
    sx.stroke(); sx.setLineDash([]);
    sx.fillStyle = 'rgba(143,255,136,.9)'; sx.textAlign = 'center';
    formants.forEach((f, i) => {
      const x = lx(f);
      sx.strokeStyle = 'rgba(143,255,136,.35)'; sx.beginPath(); sx.moveTo(x, 18 * d); sx.lineTo(x, H - 16 * d); sx.stroke();
      sx.fillText('F' + (i + 1), x, 14 * d);
    });
  }
  const slow = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = 0;
  function frame(t) {
    if (!slow || t - last > 250) { last = t; drawTract(); drawSpec(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
